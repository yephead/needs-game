<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 100" width="240" height="100">
  <defs>
    <linearGradient id="lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2b1a" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#10100c" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e27a"/>
      <stop offset="0.5" stop-color="#caa83f"/>
      <stop offset="1" stop-color="#8a6c1f"/>
    </linearGradient>
  </defs>
  <!-- temple arms -->
  <rect x="2" y="40" width="34" height="9" rx="4" fill="url(#gold)"/>
  <rect x="204" y="40" width="34" height="9" rx="4" fill="url(#gold)"/>
  <!-- green/red web stripe on temples -->
  <rect x="6" y="42" width="26" height="2.4" fill="#2f7d4f"/>
  <rect x="6" y="44.4" width="26" height="2.4" fill="#b23a3a"/>
  <rect x="208" y="42" width="26" height="2.4" fill="#2f7d4f"/>
  <rect x="208" y="44.4" width="26" height="2.4" fill="#b23a3a"/>
  <!-- bridge -->
  <path d="M110 44 q10 -10 20 0" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>
  <!-- lenses -->
  <g stroke="url(#gold)" stroke-width="5">
    <rect x="34" y="26" width="72" height="48" rx="22" fill="url(#lens)"/>
    <rect x="134" y="26" width="72" height="48" rx="22" fill="url(#lens)"/>
  </g>
  <!-- highlight -->
  <path d="M44 36 q18 -8 40 -2" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="3" stroke-linecap="round"/>
  <path d="M144 36 q18 -8 40 -2" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="3" stroke-linecap="round"/>
  <!-- interlocking GG-evocative emblem -->
  <g fill="none" stroke="url(#gold)" stroke-width="3">
    <circle cx="64" cy="50" r="9"/>
    <circle cx="74" cy="50" r="9"/>
  </g>
</svg>
