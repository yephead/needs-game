<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 156" width="120" height="156">
  <defs>
    <radialGradient id="dial" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#1b2a3a"/>
      <stop offset="1" stop-color="#0a1118"/>
    </radialGradient>
    <linearGradient id="goldw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e27a"/>
      <stop offset="1" stop-color="#9a781f"/>
    </linearGradient>
  </defs>
  <!-- strap -->
  <rect x="44" y="2" width="32" height="60" rx="8" fill="url(#goldw)"/>
  <rect x="44" y="94" width="32" height="60" rx="8" fill="url(#goldw)"/>
  <!-- case -->
  <circle cx="60" cy="78" r="40" fill="url(#goldw)"/>
  <circle cx="60" cy="78" r="33" fill="url(#dial)" stroke="#0a1118" stroke-width="2"/>
  <!-- hour ticks -->
  <g stroke="#f6e27a" stroke-width="2">
    <line x1="60" y1="50" x2="60" y2="56"/><line x1="60" y1="100" x2="60" y2="106"/>
    <line x1="32" y1="78" x2="38" y2="78"/><line x1="82" y1="78" x2="88" y2="78"/>
  </g>
  <!-- hands -->
  <line x1="60" y1="78" x2="60" y2="58" stroke="#f6e27a" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="78" x2="76" y2="84" stroke="#f6e27a" stroke-width="3" stroke-linecap="round"/>
  <circle cx="60" cy="78" r="3" fill="#f6e27a"/>
</svg>
